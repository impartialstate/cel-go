# A policy which reads the same objects from two validations, to confirm the
# read is made once.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srepeatedlookup
spec:
  crd:
    spec:
      names:
        kind: K8sRepeatedLookup
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: K8sNativeValidation
          source:
            validations:
              - expression: >-
                  size(inventory.list("networking.k8s.io/v1", "Ingress")) < 100
                message: "the cluster holds too many ingresses"
              - expression: >-
                  inventory.list("networking.k8s.io/v1", "Ingress")
                    .all(ingress, has(ingress.metadata.name))
                message: "an ingress has no name"
