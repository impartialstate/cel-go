# A policy whose two lookups do not depend on each other, so both are resolved
# in one round.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8smultilookup
spec:
  crd:
    spec:
      names:
        kind: K8sMultiLookup
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: K8sNativeValidation
          source:
            variables:
              - name: ingresses
                expression: 'inventory.list("networking.k8s.io/v1", "Ingress")'
              - name: services
                expression: 'inventory.list("v1", "Service", variables.anyObject.metadata.namespace)'
            validations:
              - expression: "size(variables.ingresses) + size(variables.services) < 100"
                message: "the namespace holds too many objects"
