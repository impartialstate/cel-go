# A policy whose second lookup depends on the result of the first, which takes
# one round of evaluation each.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8schainedlookup
spec:
  crd:
    spec:
      names:
        kind: K8sChainedLookup
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: K8sNativeValidation
          source:
            variables:
              - name: namespaceObject
                expression: >-
                  inventory.get("v1", "Namespace", variables.anyObject.metadata.namespace)
              - name: owner
                expression: >-
                  variables.namespaceObject != null && has(variables.namespaceObject.metadata.labels)
                    ? string(variables.namespaceObject.metadata.labels.owner) : ""
              - name: ownerConfig
                expression: >-
                  variables.owner == "" ? null : inventory.get("v1", "ConfigMap", "config", variables.owner)
            validations:
              - expression: "variables.ownerConfig != null"
                messageExpression: >-
                  "namespace " + variables.anyObject.metadata.namespace +
                  " has no owner configuration in the config namespace"
