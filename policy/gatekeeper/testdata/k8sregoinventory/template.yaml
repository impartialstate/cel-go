# A policy which reads the inventory by the paths a Rego implementation uses,
# so that a constraint ported to CEL keeps the shape it had.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sregoinventory
spec:
  crd:
    spec:
      names:
        kind: K8sRegoInventory
      validation:
        openAPIV3Schema:
          type: object
          properties:
            provider:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: K8sNativeValidation
          source:
            variables:
              # data.inventory.namespace[<namespace>][<apiVersion>][<kind>] holds
              # every object of a kind in a namespace, keyed by name.
              - name: services
                expression: >-
                  data.inventory.namespace[variables.anyObject.metadata.namespace]["v1"]["Service"]
              # data.inventory.cluster[<apiVersion>][<kind>][<name>] reads one
              # cluster-scoped object.
              - name: namespaceObj
                expression: >-
                  data.inventory.cluster["v1"]["Namespace"][variables.anyObject.metadata.namespace]
              - name: selectorNames
                expression: >-
                  variables.services.filter(name,
                    has(variables.services[name].spec.selector) &&
                    variables.services[name].spec.selector == variables.anyObject.metadata.labels)
              - name: signatures
                expression: >-
                  external_data({
                    "provider": variables.params.provider,
                    "keys": has(variables.anyObject.spec.containers)
                      ? variables.anyObject.spec.containers.map(c, c.image) : []
                  })
            validations:
              - expression: "size(variables.selectorNames) > 0"
                messageExpression: >-
                  "no service in " + variables.anyObject.metadata.namespace +
                  " selects this pod"
              - expression: >-
                  variables.namespaceObj != null &&
                  has(variables.namespaceObj.metadata.labels)
                message: "the namespace carries no labels"
              - expression: "size(variables.signatures.errors) == 0"
                messageExpression: >-
                  "unsigned images: " +
                  variables.signatures.errors.map(failure, string(failure[0])).join(", ")
