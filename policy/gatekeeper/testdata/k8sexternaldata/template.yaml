# A policy which validates container images against an external data provider,
# the CEL equivalent of Rego's external_data builtin. The response has the shape
# the builtin returns, so a policy ported from Rego reads it the same way.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sexternaldata
spec:
  crd:
    spec:
      names:
        kind: K8sExternalData
      validation:
        openAPIV3Schema:
          type: object
          properties:
            provider:
              type: string
              description: The external data provider which validates images.
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: K8sNativeValidation
          source:
            variables:
              - name: images
                expression: >-
                  has(variables.anyObject.spec) && has(variables.anyObject.spec.containers)
                    ? variables.anyObject.spec.containers.map(container, container.image) : []
              - name: response
                expression: >-
                  externalData.get(variables.params.provider, variables.images)
              - name: rejected
                expression: >-
                  variables.response.errors.map(failure, string(failure[0]))
            validations:
              - expression: "variables.response.system_error == ''"
                messageExpression: >-
                  "the external data provider failed: " + variables.response.system_error
              - expression: "size(variables.rejected) == 0"
                messageExpression: >-
                  "images rejected by the external data provider: " + variables.rejected.join(", ")
