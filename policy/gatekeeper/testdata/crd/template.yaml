# A policy over a custom resource, reviewed against the schema its
# CustomResourceDefinition declares.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: databasebackups
spec:
  crd:
    spec:
      names:
        kind: DatabaseBackups
      validation:
        openAPIV3Schema:
          type: object
          properties:
            minReplicas:
              type: integer
            exemptEngines:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: K8sNativeValidation
          source:
            variables:
              - name: exempt
                expression: >-
                  variables.params != null && has(variables.params.exemptEngines)
                    ? variables.params.exemptEngines : []
            validations:
              - expression: >-
                  variables.anyObject.spec.engine in variables.exempt ||
                  (has(variables.anyObject.spec.backup) && variables.anyObject.spec.backup.enabled)
                messageExpression: >-
                  "database " + variables.anyObject.metadata.name +
                  " runs " + variables.anyObject.spec.engine + " without backups enabled"
              - expression: >-
                  !has(variables.anyObject.spec.replicas) ||
                  variables.anyObject.spec.replicas >= variables.params.minReplicas
                messageExpression: >-
                  "database needs at least " + string(variables.params.minReplicas) + " replicas"
