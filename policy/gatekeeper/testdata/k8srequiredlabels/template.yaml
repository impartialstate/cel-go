# The CEL implementation of the required-labels policy from the Gatekeeper
# policy library, unmodified.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredlabels
  annotations:
    description: >-
      Requires resources to contain specified labels, with values matching
      provided regular expressions.
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredLabels
      validation:
        openAPIV3Schema:
          type: object
          properties:
            message:
              type: string
            labels:
              type: array
              description: A list of labels and values the object must specify.
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: The required label.
                  allowedRegex:
                    type: string
                    description: >-
                      If specified, a regular expression the annotation's value
                      must match. The value must contain at least one match for
                      the regular expression.
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: K8sNativeValidation
          source:
            validations:
              - expression: >-
                  [object, oldObject].exists(obj, obj != null && has(obj.metadata) &&
                  variables.params.labels.all(entry, has(obj.metadata.labels) &&
                  entry.key in obj.metadata.labels))
                messageExpression: >-
                  "missing required label, requires all of: " +
                  variables.params.labels.map(entry, entry.key).join(", ")
              - expression: >-
                  [object, oldObject].exists(obj, obj != null &&
                  !variables.params.labels.exists(entry, has(obj.metadata.labels) &&
                  entry.key in obj.metadata.labels &&
                  !string(obj.metadata.labels[entry.key]).matches(string(entry.allowedRegex))))
                message: "regex mismatch"
