# The same template exercised through the CEL test runner, which reports which
# parts of the policy the tests reached. A policy yields the messages of the
# validations an object fails, so an admitted object yields an empty list.
description: Required labels admission tests
section:
  - name: "admitted"
    tests:
      - name: "labelled"
        input:
          object:
            value:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nginx
                labels:
                  owner: platform
          oldObject:
            expr: "null"
          params:
            value:
              spec:
                parameters:
                  labels:
                    - key: owner
                      allowedRegex: "^[a-z]+$"
        output:
          expr: "[]"
  - name: "rejected"
    tests:
      - name: "unlabelled"
        input:
          object:
            value:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nginx
                labels:
                  team: platform
          oldObject:
            expr: "null"
          params:
            value:
              spec:
                parameters:
                  labels:
                    - key: owner
                      allowedRegex: "^[a-z]+$"
        output:
          expr: "['missing required label, requires all of: owner']"
      - name: "label value does not match"
        input:
          object:
            value:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nginx
                labels:
                  owner: Platform-1
          oldObject:
            expr: "null"
          params:
            value:
              spec:
                parameters:
                  labels:
                    - key: owner
                      allowedRegex: "^[a-z]+$"
        output:
          expr: "['regex mismatch']"
